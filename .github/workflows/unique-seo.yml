name: Unique SEO metadata
on:
  push:
    branches: [main]
    paths:
      - "scripts/unique-meta.mjs"
      - ".github/workflows/unique-seo.yml"
      - "package.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rewrite-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rewrite SEO metadata
        run: node scripts/unique-meta.mjs
      - name: Commit changed HTML pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "SEO: unique metadata for secondary domain"
            git push origin HEAD:main
          fi
